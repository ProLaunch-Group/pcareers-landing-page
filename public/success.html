<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to ProLaunch Careers | Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    
    <style>
        .success-hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: var(--cream);
        }
        .success-card {
            background: white;
            padding: 4rem 3rem;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(13,59,56,0.1);
            max-width: 600px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .success-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--green), var(--teal));
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: var(--green-light);
            color: var(--green);
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 2rem;
        }
        h1 {
            font-size: 2.5rem;
            color: var(--forest);
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--forest);
            color: white;
            padding: 1.15rem 2.5rem;
            border-radius: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
        }
        .action-btn:hover {
            background: var(--green-dark);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <section class="success-hero">
        <div class="success-card reveal visible">
            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h1>Welcome to the Community!</h1>
            <p>Your request has been successfully received. You are now one step closer to commanding your career in the global remote landscape.</p>
            
            <a href="https://prolaunch-cv-optimizer.vercel.app/" class="action-btn">
                <span>Access AI CV Optimizer</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            
            <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border);">
                <a href="/home" style="color: var(--text-muted); font-size: 0.9rem; text-decoration: none; font-weight: 600;">
                    <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Back to Home
                </a>
            </div>
        </div>
    </section>
</body>
</html>
